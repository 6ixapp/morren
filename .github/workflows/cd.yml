name: Morren CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel configuration
        id: vercel-config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        if: steps.vercel-config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel artifact
        if: steps.vercel-config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Vercel artifact
        if: steps.vercel-config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Report missing Vercel configuration
        if: steps.vercel-config.outputs.configured != 'true'
        run: echo "Vercel deployment skipped. Configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in the production environment."

  deploy-backend:
    name: Deploy backend to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check Railway configuration
        id: railway-config
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RAILWAY_DEPLOY_HOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Railway deployment
        if: steps.railway-config.outputs.configured == 'true'
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body --retry 3 --retry-delay 5 --request POST "$RAILWAY_DEPLOY_HOOK_URL"

      - name: Report missing Railway configuration
        if: steps.railway-config.outputs.configured != 'true'
        run: echo "Railway deployment skipped. Configure RAILWAY_DEPLOY_HOOK_URL in the production environment."

  smoke-test:
    name: Production smoke test
    needs: [deploy-frontend, deploy-backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check configured endpoints
        id: endpoint-config
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          BACKEND_HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ] && [ -z "$BACKEND_HEALTHCHECK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check frontend
        if: steps.endpoint-config.outputs.configured == 'true' && vars.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: curl --fail --retry 10 --retry-delay 10 --retry-connrefused --max-time 30 "$FRONTEND_URL"

      - name: Check backend health
        if: steps.endpoint-config.outputs.configured == 'true' && vars.BACKEND_HEALTHCHECK_URL != ''
        env:
          BACKEND_HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL }}
        run: test "$(curl --fail --retry 10 --retry-delay 10 --retry-connrefused --max-time 30 --silent --output /dev/null --write-out '%{http_code}' "$BACKEND_HEALTHCHECK_URL")" = "200"

      - name: Report missing smoke-test configuration
        if: steps.endpoint-config.outputs.configured != 'true'
        run: echo "Smoke tests skipped. Configure FRONTEND_URL and/or BACKEND_HEALTHCHECK_URL as production variables."
