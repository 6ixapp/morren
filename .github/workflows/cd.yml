name: Morren CD - DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check DigitalOcean configuration
        id: config
        env:
          DIGITALOCEAN_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DIGITALOCEAN_USER: ${{ secrets.DIGITALOCEAN_USER }}
          DIGITALOCEAN_SSH_KEY: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
          DIGITALOCEAN_KNOWN_HOSTS: ${{ secrets.DIGITALOCEAN_KNOWN_HOSTS }}
        run: |
          if [ -n "$DIGITALOCEAN_HOST" ] && [ -n "$DIGITALOCEAN_USER" ] && [ -n "$DIGITALOCEAN_SSH_KEY" ] && [ -n "$DIGITALOCEAN_KNOWN_HOSTS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start SSH agent
        if: steps.config.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}

      - name: Configure known host
        if: steps.config.outputs.configured == 'true'
        env:
          DIGITALOCEAN_KNOWN_HOSTS: ${{ secrets.DIGITALOCEAN_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DIGITALOCEAN_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy latest main commit
        if: steps.config.outputs.configured == 'true'
        env:
          DIGITALOCEAN_HOST: ${{ secrets.DIGITALOCEAN_HOST }}
          DIGITALOCEAN_USER: ${{ secrets.DIGITALOCEAN_USER }}
          DIGITALOCEAN_PORT: ${{ secrets.DIGITALOCEAN_PORT }}
          DIGITALOCEAN_APP_DIR: ${{ vars.DIGITALOCEAN_APP_DIR }}
        run: |
          PORT="${DIGITALOCEAN_PORT:-22}"
          APP_DIR="${DIGITALOCEAN_APP_DIR:-/opt/morren}"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$PORT" "$DIGITALOCEAN_USER@$DIGITALOCEAN_HOST" "cd '$APP_DIR' && bash deploy/deploy.sh"

      - name: Verify DigitalOcean health endpoint
        if: steps.config.outputs.configured == 'true' && vars.DIGITALOCEAN_HEALTH_URL != ''
        env:
          DIGITALOCEAN_HEALTH_URL: ${{ vars.DIGITALOCEAN_HEALTH_URL }}
        run: curl --fail --retry 10 --retry-delay 10 --retry-connrefused --max-time 30 "$DIGITALOCEAN_HEALTH_URL"

      - name: Report missing DigitalOcean configuration
        if: steps.config.outputs.configured != 'true'
        run: echo "DigitalOcean deployment skipped. Configure the required production secrets documented in docs/CI_CD.md."
